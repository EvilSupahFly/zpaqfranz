name: Track upstream release and build .deb

on:
  schedule:
    - cron: '0 6 1,15 * *'  # twice monthly (1st & 15th, 06:00 UTC) - matches release cadence
  workflow_dispatch:      # lets you trigger a run manually to test
    inputs:
      tag:
        description: 'Force a specific upstream tag'
        required: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          up="$INPUT_TAG"
          [ -z "$up" ] && up=$(gh api repos/fcorbelli/zpaqfranz/releases/latest --jq .tag_name)
          mine=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || echo none)
          echo "tag=$up" >> "$GITHUB_OUTPUT"
          if [ "$up" != "$mine" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    env:
      DEBFULLNAME: Seann Giffin
      DEBEMAIL: seann.giffin@gmail.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: fcorbelli/zpaqfranz
          ref: ${{ needs.check.outputs.tag }}
          path: src
      - run: sudo apt-get update && sudo apt-get install -y debhelper devscripts build-essential
      - name: Fetch release source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release download "$TAG" -R fcorbelli/zpaqfranz -p zpaqfranz.cpp -D src --clobber
          grep -m1 '#define ZPAQ_VERSION' src/zpaqfranz.cpp
          grep -q "#define ZPAQ_VERSION \"${TAG}" src/zpaqfranz.cpp
      - name: Overlay and build
        run: |
          v="${{ needs.check.outputs.tag }}"
          cp -r debian src/debian
          cd src
          dch --create -v "${v}-0~local1" --package zpaqfranz -D noble "Automated build of upstream ${v}"
          dpkg-buildpackage -us -uc -b
      - name: Check package contents
        run: |
          dpkg-deb -c ./zpaqfranz_*_amd64.deb
          if dpkg-deb -c ./zpaqfranz_*_amd64.deb | grep -E ' \./usr/(local/)?bin/dir( ->|$)'; then
            echo "Package ships a 'dir' file or symlink; this conflicts with coreutils" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deb-packages
          path: zpaqfranz_*.deb
          retention-days: 7

      - name: Smoke test
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          sudo dpkg -i ./zpaqfranz_*_amd64.deb
          command -v zpaqfranz
          sha256sum /usr/bin/zpaqfranz
          set +e
          zpaqfranz > out.txt 2>&1
          echo "exit status: $?"
          head -n 3 out.txt | cat -A
          strings /usr/bin/zpaqfranz | grep -m3 'ZPAQ\|65\.22\|63\.5'
          set -e
          grep -qF "v${TAG}" out.txt
          dpkg -L zpaqfranz

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          body: "Unofficial .deb of upstream ${{ needs.check.outputs.tag }}: https://github.com/fcorbelli/zpaqfranz/releases/tag/${{ needs.check.outputs.tag }}"
          files: ./zpaqfranz_*.deb
          fail_on_unmatched_files: true